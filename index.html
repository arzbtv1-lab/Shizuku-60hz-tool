<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60Hz & Shizuku Tool</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding: 30px 20px;
            margin: 0;
        }
        h2 { margin-bottom: 25px; color: #38bdf8; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .info { text-align: left; }
        .info b { font-size: 18px; display: block; margin-bottom: 5px; }
        .info span { font-size: 14px; color: #94a3b8; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #0369a1; }
    </style>
</head>
<body>

    <h2>60Hz & Shizuku Control</h2>

    <div class="card">
        <div class="info">
            <b>60Hz Refresh Rate</b>
            <span>ตั้งค่ารีเฟรชเรทหน้าจอ</span>
        </div>
        <button onclick="run60Hz()">เปิดใช้งาน</button>
    </div>

    <div class="card">
        <div class="info">
            <b>Shizuku Root</b>
            <span>สิทธิ์ Shizuku (อนุญาต)</span>
        </div>
        <button onclick="runShizuku()">เชื่อมต่อ</button>
    </div>

    <script>
        function run60Hz() {
            alert("ส่งคำสั่งตั้งค่า 60Hz เรียบร้อย!");
        }
        function runShizuku() {
            alert("เชื่อมต่อสิทธิ์ Shizuku สำเร็จ!");
        }
    </script>

</body>
  </html>
